<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Painel Pomodoro Bot</title>
    <!-- Fonte moderna -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
      .font-inter { font-family: 'Inter', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial; }
      #modal { transition: opacity 240ms ease, transform 240ms ease; }
      #modal.hidden > div { transform: translateY(-6px); opacity: 0; }
      #modal.flex > div { transform: translateY(0); opacity: 1; }
    </style>
  </head>
  <body class="app-root">
    <div class="min-h-screen flex">
      <!-- SIDEBAR -->
      <aside id="sidebar" class="sidebar">
        <div class="sidebar-header">
          <h1>Pomodoro Admin</h1>
          <p>Painel da Loja</p>
        </div>
        <nav class="sidebar-nav">
          <button id="nav-loja" class="nav-btn">Loja</button>
          <button id="nav-compras" class="nav-btn">Compras</button>
          <button id="nav-usuarios" class="nav-btn">Usuários</button>
        </nav>
        <div class="sidebar-footer">Versão: 1.0 • Backend: JSON</div>
      </aside>

      <!-- MAIN -->
      <main class="main-content">
        <header class="main-header">
          <div>
            <h2>Painel da Loja — Pomodoro Bot</h2>
            <p class="lead">Controle e administre recompensas e compras</p>
          </div>
          <div class="token-box">
            <label class="token-label">Admin Token</label>
            <input id="token" class="token-input" placeholder="Cole o token admin aqui" />
            <button id="btn-clear-token" class="btn btn-ghost">Limpar</button>
            <button id="btn-toggle-side" class="btn btn-primary mobile-toggle">Menu</button>
          </div>
        </header>

        <section id="panel-loja" class="space-y-6">
          <div class="layout-grid">
            <div class="card card-store">
              <div class="flex items-center justify-between">
                <h3>Loja</h3>
                <div class="flex items-center gap-2">
                  <input id="search" placeholder="Buscar item por nome ou id" class="input-search" />
                  <select id="filter-type" class="select-filter">
                    <option value="all">Todos os tipos</option>
                    <option value="utilitario">Utilitário</option>
                    <option value="cosmetico">Cosmético</option>
                    <option value="role">Role</option>
                    <option value="insignia">Insígnia</option>
                  </select>
                </div>
              </div>

              <div id="loja-grid" class="loja-grid"></div>
            </div>
            <div class="card card-stats">
              <h3>Estatísticas</h3>
              <div id="stats" class="stats-list"></div>
            </div>
          </div>

          <div class="card card-purchases">
            <h3>Compras recentes</h3>
            <div id="compras-table" class="purchases-table"></div>
          </div>
        </section>

        <!-- Modal -->
        <div id="modal" class="fixed inset-0 hidden items-center justify-center bg-black/40">
          <div class="bg-white rounded-lg w-full max-w-2xl p-6 shadow">
            <div id="modal-content"></div>
            <div class="mt-4 text-right">
              <button id="modal-close" class="px-4 py-2 rounded border">Fechar</button>
              <button id="modal-refund" class="px-4 py-2 rounded bg-red-500 text-white ml-2">Reembolsar</button>
            </div>
          </div>
        </div>

        <!-- Toast -->
        <div id="toast" class="fixed bottom-6 right-6 hidden"></div>
      </main>
    </div>

    <script src="app.js"></script>
  </body>
  </html>
